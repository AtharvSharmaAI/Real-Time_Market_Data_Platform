global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "market-data-processor"
    static_configs:
      - targets: ["processor:8000"]

  - job_name: "market-data-api"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "kafka-connect"
    static_configs:
      - targets: ["connect:8083"]
